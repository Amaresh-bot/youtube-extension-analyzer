<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YT Analyzer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Space Mono', monospace;
      padding: 0;
      overflow: hidden;
    }

    header {
      background: #ff0000;
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header svg { flex-shrink: 0; }
    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      letter-spacing: 0.06em;
      color: #fff;
      text-transform: uppercase;
    }

    .status-bar {
      background: #111;
      border-bottom: 1px solid #222;
      padding: 8px 16px;
      font-size: 10px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #333;
      transition: background 0.3s;
    }
    .dot.active { background: #00e676; box-shadow: 0 0 6px #00e676; }

    .card {
      padding: 16px;
      border-bottom: 1px solid #1a1a1a;
    }
    .card:last-child { border-bottom: none; }

    .label {
      font-size: 9px;
      letter-spacing: 0.12em;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .value {
      font-size: 13px;
      color: #f0f0f0;
      word-break: break-word;
      line-height: 1.4;
    }
    .value.big {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      color: #fff;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      background: #1a1a1a;
      border: 1px solid #1a1a1a;
      border-radius: 4px;
      overflow: hidden;
      margin: 16px;
    }
    .stat {
      background: #0f0f0f;
      padding: 10px 8px;
      text-align: center;
    }
    .stat .s-val { font-size: 13px; font-weight: 700; color: #fff; }
    .stat .s-lbl { font-size: 8px; color: #444; margin-top: 2px; letter-spacing: 0.1em; text-transform: uppercase; }

    .insight-bar {
      margin: 0 16px 16px;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-align: center;
    }
    .insight-high    { background: #0d2b1a; color: #00e676; border: 1px solid #00e676; }
    .insight-average { background: #2b2000; color: #ffab00; border: 1px solid #ffab00; }
    .insight-low     { background: #2b0d0d; color: #ff5252; border: 1px solid #ff5252; }

    .empty {
      padding: 32px 16px;
      text-align: center;
      color: #333;
      font-size: 11px;
      line-height: 1.8;
    }
    .empty strong { color: #555; display: block; margin-bottom: 4px; font-size: 12px; }
  </style>
</head>
<body>

<header>
  <!-- YouTube-style play icon -->
  <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-2.75 12.31 12.31 0 0 0-6.84.41 4.83 4.83 0 0 1-3.77 2.75A4.78 4.78 0 0 0 2 11.5v1a4.78 4.78 0 0 0 3.21 4.4 4.83 4.83 0 0 1 3.77 2.75 12.31 12.31 0 0 0 6.84-.41 4.83 4.83 0 0 1 3.77-2.75A4.78 4.78 0 0 0 22 12.5v-1a4.78 4.78 0 0 0-2.41-4.81zM10 15V9l5 3z"/>
  </svg>
  <h1>YT Activity Analyzer</h1>
</header>

<div class="status-bar">
  <div class="dot" id="dot"></div>
  <span id="status-text">Waiting for video…</span>
</div>

<div id="results">
  <div class="empty">
    <strong>No video detected yet</strong>
    Open a YouTube video and this panel will update automatically.
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
